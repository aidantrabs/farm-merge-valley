[project]
name = "fmvbot"
version = "0.1.0"
description = "Plays Farm Merge Valley for you"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.0",
]

[project.scripts]
fmvbot = "fmvbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmvbot"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# predicates passed to Bot.wait_for are awaited inside the same loop iteration
ignore = ["B023"]
